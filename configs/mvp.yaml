system:
  name: "MultiModal Visual Patch System"
  version: "1.0.0"

dataset:
  desired_count: 20000
  save_index: outputs/datalist/train_index.jsonl   # ← 可复现实验的样本清单

paths:
  data_root: "data"
  images: "data/images/mscoco/train2014"
  instances: "data/instances"
  text: "data/text"
  outputs: "outputs"
  pt_output: "outputs/pt"
  sam_output: "outputs/sam"
  compress_output: "outputs/payloads"
  reconstruction_output: "outputs/recon"

locate:
  p_high: 0.92
  p_low: 0.78
  min_area_ratio: 0.001
  nms_iou: 0.5
  top_k: 5
  return_heatmap: true

segment:
  model_type: "vit_b"
  checkpoint: "segment-anything/weights/sam_vit_b_01ec64.pth"
  device: "auto"

compress:
  output_dir: outputs/payloads
  neural:
    num_stages: 4
    base_channels: 64
    vga_channels: 32
    vga_layers: 3
    # ☆ 关键：两者相等 → 屏蔽 VGA
    qstep_roi: 0.5
    qstep_bg: 0.5
    tau_min: 1.0e-3     # 允许够小，便于拉高 bpp
    tau_max: 8.0
    search_iters: 10
    weights: "checkpoints/vga_e2e.pth"   # AE 权重
    zlib_level: 0        # 先不压缩，便于对齐 target_bpp

recon:
  neural:
    num_stages: 4
    base_channels: 64
    vga_channels: 32
    vga_layers: 3
    weights: "checkpoints/vga_e2e.pth"   # 与上面相同的权重

pipeline:
  target_bpp: 10.0
  bpp_tolerance: 1

neural:                  # 训练期默认，同样保持相等
  num_stages: 4
  base_channels: 64
  vga_channels: 32
  vga_layers: 3
  qstep_roi: 2         # ☆ 相等
  qstep_bg: 6          # ☆ 相等
  tau_train: 1.0
  weights: checkpoints/vga_e2e.pth

train:
  epochs: 10
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 0
  train_size: [512, 512]
  use_quant: true      # 你现在是 AE 阶段；等做 Stage-B 再设 true
  roi_weight: 1.0
  save_dir: checkpoints
  save_name: vga_e2e.pth
  save_vis: false
